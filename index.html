<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sophia Marinova | Portfolio</title>

  <!-- Your main styles (pink buttons, fonts, typewriter CSS, etc.) -->
  <link rel="stylesheet" href="style.css">

  <!-- Minimal page-specific styles for the Hydra background + layout -->
  <style>
    :root{
      --text:#0f172a;
    }
    *,*::before,*::after{ box-sizing: border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      color:var(--text);
      overflow:hidden; /* so the hydra canvas fills perfectly */
    }

    /* Hydra background canvas */
    #hydra-bg{
      position:fixed; inset:0; z-index:-2; display:block; width:100vw; height:100vh;
    }

    /* Subtle veil over hydra to increase legibility */
    .backdrop{
      position:fixed; inset:0; z-index:-1;
      background: radial-gradient(1000px 600px at 50% 5%,
        rgba(255,255,255,.25), rgba(255,255,255,.12) 40%,
        rgba(255,255,255,.06) 70%, rgba(255,255,255,0) 100%);
      pointer-events:none;
    }

    /* Pencil/ink drawing overlay */
    #draw-overlay{
      position:fixed; inset:0; z-index:10; pointer-events:none; /* drawing is programmatic only */
    }

    .container{
      position:relative; z-index:5; /* above background */
      max-width:980px; margin:0 auto; padding:48px 20px; text-align:center;
    }

    /* Fallback h1 size if not set in style.css */
    h1{font-size:clamp(28px,4vw,40px); margin:18px 0 8px;}
    p.lead{margin:0 0 28px; opacity:.95}

    .button-row{display:flex; gap:16px; flex-wrap:wrap; justify-content:center}
    @media (max-width:600px){ .container{padding-top:36px} }
  </style>
</head>
<body>
  <!-- Hydra background -->
  <canvas id="hydra-bg"></canvas>
  <div class="backdrop"></div>

  <!-- Cursor drawing overlay -->
  <canvas id="draw-overlay"></canvas>

  <main class="container">
    <h1 id="title" class="typewriter" aria-live="polite"></h1>
    <p class="lead">Hi, I’m Sophia Marinova, a Computer Science student at ASU.</p>

    <div class="button-row">
      <a class="btn" href="about.html">About Me</a>
      <a class="btn" href="projects.html">Projects</a>
      <a class="btn" href="experimental.html">Experimental</a>
      <a class="btn" href="certificates.html">Certificates</a>
    </div>
  </main>

  <!-- Hydra synth (background visuals) -->
  <script src="https://unpkg.com/hydra-synth"></script>
  <script>
    // Size canvases to pixel-perfect viewport
    function fitCanvas(c){
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      c.width = Math.floor(innerWidth * dpr);
      c.height = Math.floor(innerHeight * dpr);
      c.style.width = innerWidth + 'px';
      c.style.height = innerHeight + 'px';
      const ctx = c.getContext('2d');
      if (ctx) ctx.setTransform(dpr,0,0,dpr,0,0);
    }

    const hydraCanvas = document.getElementById('hydra-bg');
    const drawCanvas = document.getElementById('draw-overlay');
    fitCanvas(hydraCanvas);
    fitCanvas(drawCanvas);
    addEventListener('resize', () => { fitCanvas(hydraCanvas); fitCanvas(drawCanvas); });

    // HYDRA: initialize and run a kaleidoscopic color-flow.
    (async () => {
      try{
        if (window.initHydra) {
          // If Strudel is present
          await window.initHydra({ feedStrudel: 1, canvas: hydraCanvas });
        } else {
          // Plain Hydra instance
          const hydra = new Hydra({ canvas: hydraCanvas, detectAudio:false });
          // A time-varying kaleidoscope count (cycles between 4–6)
          const kCount = () => 4 + Math.floor(2 * Math.abs(Math.sin((window.time || 0) * 0.35)));

          osc(1, 0.5, 5)                // base field
            .kaleid(kCount)             // similar to H("<4 5 6>")
            .diff(osc(1, 0.5, 5))
            .modulateScale(osc(2, -0.25, 1))
            .out();
        }
      } catch(e){
        console.warn('Hydra init failed:', e);
      }
    })();

    // CURSOR PENCIL TRAIL — lightweight, pressure-ish stroke with a soft fade
    (function pencilTrail(){
      const ctx = drawCanvas.getContext('2d');
      let last = null; // last mouse position
      let drawing = false; // only fade when drawing happened

      // Style for a pencil-y look
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      function fade(){
        // Gently fade previous strokes to mimic graphite
        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        ctx.globalAlpha = 0.06;   // lower = longer persistence
        ctx.fillRect(0,0,drawCanvas.width, drawCanvas.height);
        ctx.restore();
      }

      let lastT = 0;
      function onMove(e){
        const t = e.touches ? e.touches[0] : e;
        const x = t.clientX;
        const y = t.clientY;
        const now = performance.now();
        const dt = Math.max(16, now - lastT);
        lastT = now;

        if (last){
          const dx = x - last.x; const dy = y - last.y;
          const speed = Math.hypot(dx,dy) / dt; // px per ms
          const w = Math.max(1.5, Math.min(6, 6 - speed*8)); // thinner when faster

          ctx.strokeStyle = 'rgba(30,30,30,0.9)';
          ctx.lineWidth = w;

          // slight texture by drawing multiple micro-strokes with small jitter
          for (let i=0;i<2;i++){
            const jx = (Math.random()-0.5)*0.6;
            const jy = (Math.random()-0.5)*0.6;
            ctx.beginPath();
            ctx.moveTo(last.x + jx, last.y + jy);
            ctx.lineTo(x + jx, y + jy);
            ctx.stroke();
          }
        }
        last = {x,y};
        drawing = true;
      }

      function stop(){ last = null; drawing=false; }

      addEventListener('mousemove', onMove, {passive:true});
      addEventListener('touchmove', onMove, {passive:true});
      addEventListener('mouseleave', stop);
      addEventListener('touchend', stop);

      // animation loop for fading
      function loop(){ if(drawing) fade(); requestAnimationFrame(loop); }
      loop();
    })();
  </script>

  <!-- TYPEWRITER: placed at the very end (Option A) -->
  <script>
    (function(){
      const el = document.getElementById('title');
      if (!el) return; // safety

      const text = "Welcome to My Portfolio";
      const speed = 50; // ms per character
      let i = 0;

      function type() {
        if (i <= text.length) {
          el.textContent = text.slice(0, i++);
          setTimeout(type, speed);
        }
      }

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        el.textContent = text;
      } else {
        type();
      }
    })();
  </script>
</body>
</html>
